services:

  db:
    image: postgres:16
    container_name: db
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=db
    volumes:
      - ./postgres:/var/lib/postgresql/data/
    networks:
      - microservice
    ports:
      - "5433:5432"

volumes:
  postgres:

networks:
  microservice:
    driver: bridge